name: hustlehub

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Set MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    # MongoDB is only reachable from the other containers, not from the host
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Fills the database with the demo users, gigs, bookings and transactions.
  # Runs once after MongoDB is healthy and then exits. Note: it clears existing
  # data first, so every "docker compose up" starts from the same demo data.
  seed:
    build: ./backend
    command: ["node", "scripts/seed.js"]
    restart: "no"
    environment:
      NODE_ENV: development # the seed script refuses to run in production
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/hustlehub?authSource=admin
      SEED_PASSWORD: ${SEED_PASSWORD:?Set SEED_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      USE_HTTPS: "false" # no certificates inside the container
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/hustlehub?authSource=admin
      FRONTEND_URL: http://localhost:8080
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      BOOKING_RATE_LIMIT: ${BOOKING_RATE_LIMIT:-5}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-300}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo-data: