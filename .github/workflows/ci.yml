name: CI

on:
  push:
    branches: [main, viandra-part3, kaitlyn-part3, nikkita-part3]
  pull_request:
    branches: [main]

# Least privilege: jobs can only read the repository contents
permissions:
  contents: read

# One place to change the Node.js version used by every job
env:
  NODE_VERSION: 22

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails on any ESLint error or warning, including eslint-plugin-security
      - name: Run backend lint (including security rules)
        run: npm run lint

      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Check out code (full history for secret scanning)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Fails the job if any high or critical vulnerability is found
      # Low and moderate findings are still listed in the log
      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      # Fails the job if any secret (API key, password, token, private key)
      # is found in the commits being scanned
      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The action above only scans the newest commit on a push
      # This scans every commit in the repository's history, so a secret
      # that was committed and later deleted would still be caught (Microsoft, 2026a)
      - name: Scan full git history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1
      
      
  docker:
    name: Docker stack, API tests and ZAP scan
    runs-on: ubuntu-latest
    # Only runs after the unit tests, lint and build have passed
    needs: [backend, frontend]
    timeout-minutes: 30
    env:
      # Settings for the containers. Nothing secret is written in this file:
      # the JWT secret and the demo password are created fresh for every run in
      # the next step, and no .env file is committed.
      USE_HTTPS: 'false'
      MONGODB_URI: mongodb://mongo:27017/hustlehub?replicaSet=rs0
      # Raised so the 79 Newman requests are not blocked by the login and
      # booking rate limits. The rate-limit tests below restart the API with
      # the real limits.
      AUTH_RATE_LIMIT: '1000'
      BOOKING_RATE_LIMIT: '1000'
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Create throwaway credentials for this run
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          SEED_PASSWORD="Ci1-$(openssl rand -hex 12)"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$SEED_PASSWORD"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "SEED_PASSWORD=$SEED_PASSWORD" >> "$GITHUB_ENV"

      # Builds both images and starts MongoDB, the seed step, the API and the
      # frontend. --wait returns only when mongo, the backend and the frontend
      # are all healthy, and fails if any of them is not.
      - name: Build and start the stack
        run: docker compose up --build --wait --wait-timeout 300

      - name: Show the running containers
        run: docker compose ps -a

      - name: Check the backend health endpoint returns 200
        run: curl --fail --silent --show-error http://localhost:5000/health

      - name: Check the frontend Nginx server responds
        run: curl --fail --silent --show-error --output /dev/null http://localhost:8080

      - name: Install Newman
        run: npm install --global newman@6 newman-reporter-htmlextra

      # Any failed assertion makes Newman exit with an error and fails the job
      - name: Run the API tests with Newman
        run: |
          newman run postman/HustleHub-Part2.postman_collection.json \
            --env-var "baseUrl=http://localhost:5000" \
            --env-var "frontendUrl=http://localhost:8080" \
            --env-var "seedPassword=$SEED_PASSWORD" \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-reports/main.html \
            --reporter-htmlextra-skipSensitiveData

      # The rate-limit tests need the real limits and a fresh in-memory counter,
      # so the API is recreated before each one
      - name: Restart the API with the real rate limits (login test)
        env:
          AUTH_RATE_LIMIT: '10'
          BOOKING_RATE_LIMIT: '5'
        run: docker compose up --detach --wait --force-recreate --no-deps backend

      - name: Run the login rate-limit test with Newman
        run: |
          newman run postman/HustleHub-Part2-LoginRateLimit.postman_collection.json \
            --env-var "baseUrl=http://localhost:5000" \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-reports/login-ratelimit.html \
            --reporter-htmlextra-skipSensitiveData

      - name: Restart the API with the real rate limits (booking test)
        env:
          AUTH_RATE_LIMIT: '10'
          BOOKING_RATE_LIMIT: '5'
        run: docker compose up --detach --wait --force-recreate --no-deps backend

      - name: Run the booking rate-limit test with Newman
        run: |
          newman run postman/HustleHub-Part2-BookingRateLimit.postman_collection.json \
            --env-var "baseUrl=http://localhost:5000" \
            --env-var "seedPassword=$SEED_PASSWORD" \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-reports/booking-ratelimit.html \
            --reporter-htmlextra-skipSensitiveData

      # Medium and high risk alerts are FAIL in .zap/rules.tsv, and low and
      # informational alerts are WARN. -I stops warnings failing the job, so
      # the exit code is non-zero only when a FAIL rule finds something.
      - name: Scan the running frontend with OWASP ZAP (baseline)
        run: |
          mkdir -p zap-output
          cp .zap/rules.tsv zap-output/rules.tsv
          chmod -R a+rwx zap-output
          docker run --rm --network host \
            -v "$PWD/zap-output:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -c rules.tsv -r zap-report.html -J zap-report.json -I

      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs --no-color

      - name: Save the Newman and ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-job-reports
          path: |
            newman-reports
            zap-output/zap-report.html
            zap-output/zap-report.json
          if-no-files-found: ignore

      # Always shut the stack down, even when an earlier step failed
      - name: Shut the stack down
        if: always()
        run: docker compose down --volumes